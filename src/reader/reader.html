<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Now Reading — MelonSpeak</title>
    <link rel="stylesheet" href="reader.css" />
  </head>
  <body>
    <main>
      <!-- reader.ts adds role=button/tabindex only while the tab being read is
           backgrounded — a real <button> can't be used here because the header
           wraps an <h1>. Enter/Space are handled there too. -->
      <header id="head">
        <img src="../icons/icon48.png" alt="" width="34" height="34" />
        <div class="head-text">
          <p id="eyebrow-row">
            <span id="eyebrow">NOW READING</span>
            <span id="bg-badge" hidden></span>
          </p>
          <h1 id="title">MelonSpeak</h1>
        </div>
      </header>

      <canvas id="viz"></canvas>

      <section id="lyrics" aria-live="off"></section>

      <!-- Shown when nothing is playing. reader.ts sizes it: 'full' when there
           is no transcript, 'compact' underneath one a finished read left. -->
      <section id="cta" hidden>
        <p id="cta-lead">What should I read?</p>

        <!-- Only after a read ends, and only while its transcript is still in
             memory — which outlives the page it came from. -->
        <button class="cta-card" id="cta-replay" type="button" hidden>
          <span class="cta-icon" aria-hidden="true">↻</span>
          <span class="cta-body">
            <span class="cta-title">Read this again</span>
            <span class="cta-sub" id="cta-replay-sub"></span>
          </span>
          <span class="cta-chev" aria-hidden="true">›</span>
        </button>

        <button class="cta-card" id="cta-page" type="button">
          <span class="cta-icon" aria-hidden="true">📄</span>
          <span class="cta-body">
            <span class="cta-title">Read this page</span>
            <span class="cta-sub" id="cta-page-sub"></span>
          </span>
          <span class="cta-chev" aria-hidden="true">›</span>
        </button>

        <button class="cta-card dormant" id="cta-selection" type="button" disabled>
          <span class="cta-icon" aria-hidden="true">✏️</span>
          <span class="cta-body">
            <span class="cta-title">Read highlighted text</span>
            <span class="cta-sub" id="cta-selection-sub">
              Highlight anything on the page and it lands here
            </span>
            <span class="cta-quote" id="cta-selection-quote" hidden></span>
            <span class="cta-meta" id="cta-selection-meta" hidden></span>
          </span>
          <span class="cta-chev" aria-hidden="true">›</span>
        </button>

        <p id="cta-foot">Right-click a selection anywhere for <strong>Speak content</strong>.</p>
      </section>

      <footer id="bottom">
        <div id="transport" hidden>
          <button id="pause" title="Pause">⏸</button>
          <button id="resume" title="Resume" hidden>▶</button>
          <button id="stop" title="Stop">⏹</button>
        </div>
        <div id="model-bar">
          <div id="model-menu" hidden></div>
          <button id="model-btn" title="Voice model">
            <span class="label">Voice model</span>
            <span id="model-name">—</span>
            <span class="chev">▾</span>
          </button>
        </div>
      </footer>
    </main>
    <script type="module" src="reader.js"></script>
  </body>
</html>
