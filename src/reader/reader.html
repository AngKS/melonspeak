<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MelonSpeak</title>
    <link rel="stylesheet" href="reader.css" />
  </head>
  <body>
    <main>
      <div id="top">
        <!-- reader.ts adds role=button/tabindex only while the tab being read is
             backgrounded — a real <button> can't be used here because the header
             wraps an <h1>. Enter/Space are handled there too. The menu button is
             a sibling, not a child, so it never nests inside that role=button. -->
        <header id="head">
          <img src="../icons/icon48.png" alt="" width="34" height="34" />
          <div class="head-text">
            <p id="eyebrow-row">
              <span id="eyebrow">NOW READING</span>
              <span id="bg-badge" hidden></span>
            </p>
            <h1 id="title">MelonSpeak</h1>
          </div>
        </header>
        <button id="menu-btn" aria-label="Settings" aria-expanded="false" aria-controls="sheet">
          ☰
        </button>
      </div>

      <canvas id="viz"></canvas>

      <section id="lyrics" aria-live="off"></section>

      <div id="empty">
        <p>Nothing is being read right now.</p>
        <p class="hint">
          Press <strong>Read this page</strong> below — or highlight text, right-click, and
          choose <strong>Speak content</strong>.
        </p>
      </div>

      <footer id="bottom">
        <!-- Exactly one of these three shows at a time; see resolveFooterMode. -->
        <div id="setup-actions" hidden>
          <p class="foot-note">Download a voice model to start listening.</p>
          <button id="finish-setup" class="wide primary">Finish setup</button>
        </div>

        <div id="idle-actions" hidden>
          <button id="read-page" class="wide primary">▶ &nbsp;Read this page</button>
          <button id="read-selection" class="wide">▶ &nbsp;Read highlighted text</button>
        </div>

        <div id="reading-actions" hidden>
          <div id="transport">
            <button id="pause" title="Pause">⏸</button>
            <button id="resume" title="Resume" hidden>▶</button>
            <button id="stop" title="Stop">⏹</button>
          </div>
          <div id="read-split">
            <button id="read-page-live">▶ &nbsp;Read this page</button>
            <button id="read-more" aria-label="More read options" aria-expanded="false">▾</button>
            <div id="read-menu" hidden>
              <button id="menu-read-page">▶ &nbsp;Read this page</button>
              <button id="menu-read-selection">▶ &nbsp;Read highlighted text</button>
            </div>
          </div>
        </div>

        <p id="meta">
          <span id="meta-settings"></span>
          <span title="Pages are read on your device. Nothing is sent anywhere."
            >100% offline</span
          >
        </p>
      </footer>

      <div id="scrim" hidden></div>
      <aside id="sheet" hidden aria-label="Settings">
        <div class="grab"></div>
        <p class="sheet-label">Voice model</p>
        <div id="model-list"></div>
        <div class="sheet-row" id="voice-row" hidden>
          <label for="voice">Voice</label>
          <select id="voice"></select>
        </div>
        <div class="sheet-row">
          <label for="speed">Speed</label>
          <input id="speed" type="range" min="0.5" max="2" step="0.1" />
          <span id="speed-label">1.0×</span>
        </div>
        <button id="manage" class="sheet-link">Manage voices…</button>
      </aside>
    </main>
    <script type="module" src="reader.js"></script>
  </body>
</html>
