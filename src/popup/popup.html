<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon32.png" alt="" width="20" height="20" />
      <h1>MelonSpeak</h1>
      <select id="model" title="Voice model"></select>
    </header>

    <section id="setup" hidden>
      <p>Almost there — download a voice model to start listening.</p>
      <button id="open-setup" class="primary">Finish setup</button>
    </section>

    <section id="main" hidden>
      <button id="read-page" class="primary">▶ &nbsp;Read page</button>
      <button id="read-selection">▶ &nbsp;Read highlighted text</button>

      <div id="active" hidden>
        <p id="now-reading"></p>
        <div id="bar"><div id="bar-fill"></div></div>
        <div class="row">
          <button id="pause">⏸ Pause</button>
          <button id="resume" hidden>▶ Resume</button>
          <button id="stop">⏹ Stop</button>
        </div>
        <button id="open-reader">♪ &nbsp;Now Reading view</button>
      </div>

      <p id="status" hidden></p>

      <div class="row option" id="voice-row" hidden>
        <label for="voice">Voice</label>
        <select id="voice"></select>
      </div>
      <div class="row option">
        <label for="speed">Speed</label>
        <input id="speed" type="range" min="0.5" max="2" step="0.1" />
        <span id="speed-label">1.0×</span>
      </div>
    </section>

    <footer>
      <a id="manage" href="#">Manage voices</a>
      <span title="Pages are read on your device. Nothing is sent anywhere.">100% offline</span>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
